version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: claimdesk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claimdesk_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-claimdesk_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - claimdesk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimdesk_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-claimdesk_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      FILE_UPLOAD_DIR: /app/uploads
      PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - claimdesk_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/api/auth/login || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - claimdesk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claimdesk_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - claimdesk_network

volumes:
  postgres_data:
    name: claimdesk_postgres_data
  claimdesk_uploads:
    name: claimdesk_uploads_data

networks:
  claimdesk_network:
    name: claimdesk_network
    driver: bridge
