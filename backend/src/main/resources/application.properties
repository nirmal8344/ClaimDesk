spring.application.name=claimdesk
server.port=${PORT:8080}
# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/claimdesk_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:8344}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# JWT Security Configuration
jwt.secret=${JWT_SECRET:claimdesk_adz4needz_super_secret_jwt_key_2026_claim_processing_platform_secure_token!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost,http://localhost:80,http://127.0.0.1:5173}

# Security and Error Exposure Controls
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-exception=false
server.error.include-binding-errors=always

